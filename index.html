<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RYUMAP</title>
<style>
:root{--bg:#eef1f6;--panel:rgba(255,255,255,.82);--line:rgba(20,30,50,.12);--text:#16202e;--sub:#5b6778;--accent:#4f6df5;--accent-t:#fff;--shadow:0 8px 30px rgba(20,30,60,.18);--field:rgba(255,255,255,.9);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1220;--panel:rgba(26,32,52,.84);--line:rgba(255,255,255,.14);--text:#e9eefb;--sub:#97a3bd;--accent:#7b93ff;--accent-t:#0d1220;--shadow:0 8px 30px rgba(0,0,0,.5);--field:rgba(255,255,255,.08);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1220;--panel:rgba(26,32,52,.84);--line:rgba(255,255,255,.14);--text:#e9eefb;--sub:#97a3bd;--accent:#7b93ff;--accent-t:#0d1220;--shadow:0 8px 30px rgba(0,0,0,.5);--field:rgba(255,255,255,.08);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--panel);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;padding:7px 10px}
.logo{font-weight:800;letter-spacing:.04em}.logo b{color:var(--accent)}
#hint{flex:1;font-size:11.5px;color:var(--sub);text-align:right;line-height:1.35}
button{font:inherit;color:var(--text);background:transparent;border:0;border-radius:12px;padding:8px 11px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}
button:hover{background:var(--line)}button:disabled{opacity:.35;pointer-events:none}
button.pri{background:var(--accent);color:var(--accent-t)}button.danger{color:#e5484d}
#dock{position:absolute;left:10px;right:10px;bottom:10px;padding:8px;display:flex;gap:6px;max-width:560px;margin:0 auto}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px}
.tool i{font-style:normal;font-size:17px;line-height:1}
.tool.on{background:var(--accent);color:var(--accent-t)}
.vr{width:1px;background:var(--line);margin:4px 2px}
#sheet{position:absolute;left:10px;right:10px;bottom:84px;max-width:560px;margin:0 auto;padding:14px;max-height:56%;overflow:auto;touch-action:pan-y;display:none;-webkit-user-select:text;user-select:text}
#sheet.show{display:block}
#cmd{position:absolute;left:10px;right:10px;bottom:84px;max-width:560px;margin:0 auto;padding:12px;display:none;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#cmd.show{display:block}
#cmd .ups button.cur{box-shadow:inset 0 0 0 2px var(--accent-t)}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sh h3{flex:1;margin:0;font-size:17px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 8px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:var(--line);font-weight:700}
td.e{padding:0}
input,textarea{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px;box-sizing:border-box;width:100%;-webkit-user-select:text;user-select:text}
td.e input{border:0;border-radius:0;background:transparent;padding:7px 8px;font-size:13px}
textarea{height:90px;resize:none;margin:6px 0}
.row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;line-height:1.55;white-space:pre-wrap;margin:6px 0 2px}
.lbl{font-size:11px;color:var(--sub);margin:6px 0 2px}
.sp{flex:1}
input[type=range]{padding:0;border:0;background:none;height:24px;margin:0;touch-action:none}
.rgb{display:grid;grid-template-columns:14px 1fr 30px;gap:0 8px;align-items:center;font-size:11px;color:var(--sub)}
.rgb b{text-align:right;color:var(--text)}
.sw{height:24px;border-radius:8px;border:1px solid var(--line);margin:2px 0 6px}
#bgp{position:absolute;top:66px;right:10px;width:230px;padding:12px;display:none}
#bgp.show{display:block}
#bgp h4{margin:0 0 6px;font-size:13px}
#log{position:absolute;top:66px;left:10px;display:flex;flex-direction:column;gap:6px;max-width:62%;pointer-events:none}
.toast{padding:7px 12px;font-size:12px;border-radius:12px}
.frr{display:grid;grid-template-columns:1fr 90px 28px;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.frr i{height:6px;border-radius:3px;background:var(--line);display:block;overflow:hidden}
.frr u{display:block;height:100%;background:var(--accent)}
.frr b{text-align:right}
.logo{margin-right:auto}
.gauge{position:relative;height:22px;border-radius:11px;background:var(--line);overflow:hidden;margin:6px 0}
.gauge u{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#f5a524,#ffcf5a);transition:width .5s linear}
.gauge span{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text);text-shadow:0 0 3px var(--panel)}
.ups{display:flex;gap:6px;margin-bottom:6px}
.ups button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--line);padding:8px 4px}
.ups .n{font-size:12px}.ups .l{font-size:16px;font-weight:800}.ups .c{font-size:10.5px;color:var(--sub)}
.ups button:not(:disabled){background:var(--accent);color:var(--accent-t)}
.ups button:not(:disabled) .c{color:inherit;opacity:.85}
#top button{padding:8px 9px}
#wlp{position:absolute;top:66px;right:10px;width:min(310px,62%);padding:10px;display:none;z-index:3}
#wlp.show{display:block}
#wlp h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
#wlp h4 button{padding:3px 8px;font-size:11px}
.wb{max-height:42vh;overflow:auto;touch-action:pan-y;font-size:12px;line-height:1.45;-webkit-user-select:text;user-select:text}
.wr{padding:3px 0;border-bottom:1px solid var(--line)}.wr i{font-style:normal;color:var(--sub);margin-right:6px;font-size:10.5px}
.wr.sea{color:#3e7bfa}.wr.land{color:#e5484d}.wr.win{font-weight:800}
#net{position:absolute;top:66px;right:10px;width:min(340px,86%);padding:10px;display:none;z-index:3;touch-action:pan-y;-webkit-user-select:text;user-select:text;max-height:70vh;overflow:auto}#net.show{display:block}#net h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}#net textarea{height:72px;font-size:10px;word-break:break-all}#net button{margin:2px 2px 2px 0}
@media (max-width:520px){#hint{display:none}.logo{display:none}#top{gap:2px;padding:6px}#top button{padding:8px 6px;font-size:12px}}
#decl{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 45%,rgba(160,16,24,.94),rgba(60,4,8,.97));color:#fff;text-align:center;padding:28px;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
#decl.show{display:flex;animation:dclIn .4s ease-out}
#decl .ic{font-size:72px;line-height:1;animation:dclPulse 1s ease-in-out infinite}
#decl .nm{font-size:clamp(24px,7vw,44px);font-weight:800;line-height:1.4;word-break:break-all;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#decl .nm b{color:#ffd54a;font-size:1.25em}
#decl .tp{font-size:12px;opacity:.7;margin-top:18px;letter-spacing:.1em}
#dvp{position:absolute;top:66px;right:10px;width:min(350px,92%);padding:10px;display:none;z-index:3;max-height:68vh;overflow:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#dvp.show{display:block}
#dvp h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
#dvp h4 button{padding:3px 8px;font-size:11px}
#dvp .dvl{max-height:28vh}
.dvr{display:flex;gap:6px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.35;cursor:pointer;border-radius:8px}
.dvr.on{background:rgba(79,109,245,.16)}
.dvr i{font-style:normal;font-size:15px;width:18px;text-align:center}
.dvr .dvc{flex:1;min-width:0}
.dvr .dvm{font-size:10.5px;color:var(--sub)}
.dvr button{padding:4px 8px;font-size:13px}
#dvp .ups{flex-wrap:wrap;margin-top:4px}#dvp .ups button{flex:1 1 30%}
#cmd .ups{flex-wrap:wrap}#cmd .ups button{flex:1 1 28%}
@keyframes dclIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
@keyframes dclPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="top" class="glass"><div class="logo">RYUMAP<b>.</b></div><div id="hint"></div><div id="who" style="font-size:11.5px;color:var(--sub);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis">未接続</div><button id="fwar" style="display:none">⚔強制戦争</button><button id="fbt" style="display:none">🗡強制裏切り</button><button id="netb">🌐接続</button><button id="dvb">🪖師団</button><button id="wlb">戦況</button><button id="spd">⏩×1</button><button id="bgb">背景</button><button id="home">中央</button></div><div id="bgp" class="glass"></div><div id="wlp" class="glass"></div><div id="net" class="glass"></div><div id="dvp" class="glass"></div><div id="log"></div>
  <div id="sheet" class="glass"></div>
  <div id="cmd" class="glass"></div>
  <div id="dock" class="glass">
    <button class="tool on" data-t="select"><i>☝</i>選択・移動</button>
    <button class="tool" data-t="pen"><i>✎</i>ペン</button>
            <div class="vr"></div>
    <button class="tool" id="back"><i>↶</i>1点戻す</button>
    <button class="tool" id="close"><i>⬠</i>閉じる</button>
    <button class="tool" id="drop"><i>✕</i>破棄</button>
  </div>
</div>
<div id="decl"></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var online=true,ready=true,myUid="",myNid=0,myObj=null,lastJ="",pushT=0,peers=[],isHost=true,world={};/* 再読み込みで全てリセット：IDも国も毎回新しく、端末には保存しない */myUid="u"+Math.random().toString(36).slice(2)+Date.now().toString(36);myNid=hid(myUid);try{localStorage.removeItem("rymap_uid");localStorage.removeItem("rymap_world")}catch(e){}
function hid(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0)%2000000000+1000}
function canDraw(){return online&&ready&&!(myObj&&objs.indexOf(myObj)>=0)}
function snapOf(o){return{pts:o.pts,name:o.name,tbl:o.tbl,note:o.note,color:o.color,pop:Math.round(o.pop*100)/100,pw:Math.round(o.pw||0),civ:o.civ,mil:o.mil,edu:o.edu,auto:o.auto,houses:o.houses||[],fac:o.fac||[]}}
function pushNow(force){var o=myObj;if(!o||!o.founded)return;var j=JSON.stringify(snapOf(o));if(!force&&j===lastJ)return;lastJ=j;world[myUid]=j;saveWorld();bc({t:"s",u:myUid,j:j})}
var cv=$("cv"),ctx=cv.getContext("2d"),sheet=$("sheet");
var objs=[],cur=[],sel=null,hsel=null,usel=null,ordMode=false,editing=false,tool="select",shp=null,bg="#f6f8fb",defColor="#a8aeb7",nid=1,fr={},wars=[],speed=1,lastT=0,saveT=0,liveT=0;
var view={x:0,y:0,s:1},dpr=1,cw=0,chh=0,ACC="#4f6df5";
var HINT={select:"国をタップで詳細・宣戦布告 / 家・農地・鉱山をタップで改築 / 戦争中は師団をタップで命令（師団ボタンで一覧・一括命令） / ダブルタップ→ドラッグで図形を移動",pen:"タップで点追加・ドラッグで自由線 / 始点で閉じると国が誕生（1人1つまで）",rect:"ドラッグで四角い国を作る",circle:"ドラッグで丸い国を作る"};

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function save(){pushT=Date.now()+1200}
function w2s(p){return{x:view.x+p[0]*view.s,y:view.y+p[1]*view.s}}
function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function s2w(p){return[(p.x-view.x)/view.s,(p.y-view.y)/view.s]}
function near(sp,wp,r){var q=w2s(wp);return Math.hypot(sp.x-q.x,sp.y-q.y)<r}
function pip(pt,poly){var c=false;for(var i=0,j=poly.length-1;i<poly.length;j=i++){var a=poly[i],b=poly[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function bbox(p){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.forEach(function(q){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])});return[(x0+x1)/2,(y0+y1)/2]}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=bg;ctx.fillRect(0,0,cw,chh);var rgb=h2r(bg),lum=(.299*rgb[0]+.587*rgb[1]+.114*rgb[2])/255,gb=lum>.5?"40,55,85":"255,255,255";
  var st=20;while(st*view.s<14)st*=5;
  var l=Math.floor(-view.x/view.s/st),r=Math.ceil((cw-view.x)/view.s/st),t=Math.floor(-view.y/view.s/st),b=Math.ceil((chh-view.y)/view.s/st);
  [false,true].forEach(function(maj){
    ctx.beginPath();ctx.strokeStyle="rgba("+gb+","+(maj?(lum>.5?.22:.28):(lum>.5?.1:.12))+")";ctx.lineWidth=1;
    for(var k=l;k<=r;k++){if((k%5===0)!==maj)continue;var x=Math.round(view.x+k*st*view.s)+.5;ctx.moveTo(x,0);ctx.lineTo(x,chh)}
    for(k=t;k<=b;k++){if((k%5===0)!==maj)continue;var y=Math.round(view.y+k*st*view.s)+.5;ctx.moveTo(0,y);ctx.lineTo(cw,y)}
    ctx.stroke();
  });
  ctx.lineJoin="round";ctx.lineCap="round";
  objs.forEach(function(o){
    ctx.beginPath();o.pts.forEach(function(p,i){var q=w2s(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();
    ctx.globalAlpha=o.founded?1:.55;ctx.fillStyle=eff(o);ctx.fill();ctx.globalAlpha=1;drawPaint(o);
    var on=o===sel;ctx.strokeStyle=on?ACC:shade(o.color||"#a8aeb7",.62);ctx.lineWidth=on?3.5:2;if(!o.founded)ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
  });
  drawHouses();
  objs.forEach(function(o){
    if(!o.name)return;var c=w2s(bbox(o.pts));
    ctx.font="700 13px -apple-system,'Hiragino Sans',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.lineWidth=3;ctx.strokeStyle="rgba(255,255,255,.75)";var nmT=dn(o);ctx.strokeText(nmT,c.x,c.y);ctx.fillStyle="#26303d";ctx.fillText(nmT,c.x,c.y);
    if(o.founded){ctx.font="600 11px -apple-system,sans-serif";var tx="人口 "+popN(o.pop);ctx.strokeText(tx,c.x,c.y+15);ctx.fillText(tx,c.x,c.y+15);var bw=40,bx=c.x-bw/2,by=c.y+24;ctx.fillStyle="rgba(0,0,0,.28)";ctx.fillRect(bx,by,bw,5);ctx.fillStyle=o.pw>=30?"#f5a524":"#7b93ff";ctx.fillRect(bx,by,bw*Math.min(1,o.pw/200),5)}
  });
  objs.forEach(function(o){if(!o.founded||!o.people)return;var dk=h2r(eff(o)),lu=(.299*dk[0]+.587*dk[1]+.114*dk[2])/255;var cf=lu>.45?"#1b2230":"#ffffff",stc=tint(o.color||"#a8aeb7",.5),sdc=shade(o.color||"#a8aeb7",.5);var pk=.55*Math.max(.7,Math.min(1.1,view.s));o.people.forEach(function(q){var s2=w2s([q.x,q.y]);if(q.s&&o.dep&&o.dep[q.d])return;if(q.s){ctx.fillStyle=sdc;ctx.beginPath();ctx.arc(s2.x,s2.y,8.5*pk,0,7);ctx.fill();ctx.fillStyle=stc}else ctx.fillStyle=cf;ctx.beginPath();ctx.arc(s2.x,s2.y,(q.s?6:6.5)*pk,0,7);ctx.fill();ctx.lineWidth=1;ctx.strokeStyle="rgba(0,0,0,.5)";ctx.stroke();if(q.L){ctx.fillStyle="#f5a524";ctx.beginPath();ctx.moveTo(s2.x-3,s2.y-10);ctx.lineTo(s2.x+3,s2.y-10);ctx.lineTo(s2.x,s2.y-6);ctx.closePath();ctx.fill();ctx.strokeStyle="#7a4b00";ctx.lineWidth=1;ctx.stroke()}})});
  wars.forEach(function(w){var A=byId(w.a),B=byId(w.b);if(!A||!B)return;var p=w2s(bbox(A.pts)),q=w2s(bbox(B.pts));ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.globalAlpha=.3;ctx.strokeStyle="#e5484d";ctx.lineWidth=2;ctx.setLineDash([8,6]);ctx.stroke();ctx.globalAlpha=1;ctx.setLineDash([]);ctx.font="22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#e5484d";ctx.fillText("⚔",(p.x+q.x)/2,(p.y+q.y)/2)});
  drawFx(0);drawWar();drawFx(1);
  if(shp){var sp=shapePts(shp.k,shp.a,shp.b);ctx.beginPath();sp.forEach(function(p,i){var q=w2s(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle="rgba(79,109,245,.18)";ctx.fill();ctx.strokeStyle=ACC;ctx.lineWidth=2.5;ctx.setLineDash([6,5]);ctx.stroke();ctx.setLineDash([])}
  if(cur.length){
    ctx.beginPath();cur.forEach(function(p,i){var q=w2s(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
    ctx.strokeStyle=ACC;ctx.lineWidth=2.5;ctx.stroke();
    cur.forEach(function(p,i){var q=w2s(p);ctx.beginPath();ctx.arc(q.x,q.y,i===0&&cur.length>=3?6:3,0,7);ctx.fillStyle=i===0?"#fff":ACC;ctx.fill();if(i===0){ctx.strokeStyle=ACC;ctx.lineWidth=2.5;ctx.stroke()}});
    if(cur.length>=3){var f=w2s(cur[0]);ctx.beginPath();ctx.arc(f.x,f.y,13,0,7);ctx.strokeStyle="rgba(79,109,245,.45)";ctx.lineWidth=2;ctx.stroke()}
  }
}
function resize(){var r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;cw=r.width;chh=r.height;cv.width=Math.round(cw*dpr);cv.height=Math.round(chh*dpr);render()}
function home(){view.s=1;view.x=cw/2;view.y=chh/2-30;render()}
function zoom(f,p){var ns=Math.max(.25,Math.min(6,view.s*f));f=ns/view.s;view.x=p.x-(p.x-view.x)*f;view.y=p.y-(p.y-view.y)*f;view.s=ns;render()}

/* 入力 */
var ptr={},mode=null,lastS=null,moved=0,pinch=null,lastTap=null,mvo=null,mvl=null;
function cnt(){return Object.keys(ptr).length}
cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);var p=pos(e);ptr[e.pointerId]=p;
  if(cnt()===2){var k=Object.keys(ptr),a=ptr[k[0]],b=ptr[k[1]];mode="pinch";shp=null;pinch={d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2};return}
  if((tool==="rect"||tool==="circle")&&e.button===0){mode="shape";shp={k:tool,a:s2w(p),b:s2w(p)};if(sel){sel=null;editing=false;showSheet()}render()}else if(tool==="pen"&&e.button===0){
    mode="draw";lastS=p;if(sel){sel=null;editing=false;showSheet()}
    if(cur.length>=3&&near(p,cur[0],18))return;

  if(!o){o={id:n2,founded:true,ruler:null,people:[]};objs.push(o)}
  Object.keys(d).forEach(function(k){o[k]=d[k]});o.founded=true;o.uid=id;
  if(id===myUid){o.mine=true;myObj=o;lastJ=x}world[id]=x}
function removeOne(id){var o=byId(hid(id));if(o&&o!==myObj)objs.splice(objs.indexOf(o),1);delete world[id]}
/* ===== P2P（サーバーなし）：コードをコピペして直接つなぐ。ホストが中継 ===== */
var NP=$("net"),ns={m:"home",code:""},hostPc=null;
function enc(d){return btoa(JSON.stringify(d))}
function dec(s){return JSON.parse(atob(s.replace(/\s/g,"")))}
function mkPc(){var pc=new RTCPeerConnection({iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302","stun:stun.cloudflare.com:3478"]}]});
  pc.oniceconnectionstatechange=function(){var st=pc.iceConnectionState;if(st==="checking")say("🌐 接続を試行中…");else if(st==="failed")say("❌ 接続失敗：回線(NAT)の都合で直接つなげません。同じWi-Fiに入るか、片方のスマホをテザリングにしてみてください");else if(st==="disconnected")say("⚠ 接続が不安定です")};
  return pc}
function gathered(pc){return new Promise(function(r){if(pc.iceGatheringState==="complete")return r();var t=setTimeout(r,6000);pc.onicegatheringstatechange=function(){if(pc.iceGatheringState==="complete"){clearTimeout(t);r()}}})}
function wire(dc){
  dc.onopen=function(){peers.push(dc);ns.m="home";netUI();say("🌐 友達とつながりました");if(isHost)dc.send(JSON.stringify({t:"all",w:world}));else pushNow(true)};
  dc.onclose=function(){var i=peers.indexOf(dc);if(i>=0)peers.splice(i,1);netUI();say("🌐 接続が切れました")};
  dc.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}onNet(m,dc)}}
function onNet(m,dc){
  if(m.t==="all"){Object.keys(m.w).forEach(function(id){applyOne(id,m.w[id])});saveWorld()}
  else if(m.t==="s"){applyOne(m.u,m.j);saveWorld();if(isHost)bc(m,dc)}
  else if(m.t==="d"){removeOne(m.u);saveWorld();if(isHost)bc(m,dc)}
  else if(m.t==="wd"){startDecl(m.a,m.b);if(isHost)bc(m,dc)}
  else if(m.t==="od"){recvOrd(m);if(isHost)bc(m,dc)}
  else if(m.t==="W"){if(!isHost)applyW(m)}
  else if(m.t==="L"){if(!isHost){wlog.push({t:m.x,m:m.m,k:m.k});if(wlog.length>400)wlog.shift();drawWl()}}
  else if(m.t==="ls"){if(m.u===myUid&&myObj)loss(myObj,{i:m.i},m.n)}
  else if(m.t==="wp"){if(m.u===myUid&&myObj&&m.p<myObj.pop)myObj.pop=Math.max(2,m.p)}
  else if(m.t==="wo"){if(m.u===myUid&&myObj){myObj.pop=2;myObj.people=[];myObj.pend=[]}}}
/* ===== 戦争の同期：ホストだけが戦争を計算し、結果を全員に配る ===== */
var wT=0;
function r2(x){return Math.round(x*100)/100}
function serU(u){var o={};Object.keys(u).forEach(function(k){if(k==="tg"||k==="eng"||k==="last")return;var v=u[k];if(typeof v==="number")o[k]=r2(v);else if(v===null||typeof v==="string"||typeof v==="boolean")o[k]=v;else if(k==="ord")o.ord=v?{k:v.k,c:v.c,id:v.id}:null});
  o.e=u.eng?u.eng.id:null;o.g=u.tg?[r2(u.tg.x),r2(u.tg.y)]:null;return o}
function encPz(z,w){var out="",run=0,prev=null,i,c;for(i=0;i<z.own.length;i++){var v=z.own[i];c=v===0?".":v===w.a?"a":v===w.b?"b":"x";if(c===prev)run++;else{if(prev!==null)out+=run+prev;prev=c;run=1}}if(prev!==null)out+=run+prev;return out}
function decPz(z,str,w){var re=/(\d+)(.)/g,mm,n=0;while((mm=re.exec(str))){var c=mm[2],v=c==="a"?w.a:c==="b"?w.b:0,len=+mm[1];for(var j=0;j<len&&n<z.own.length;j++)z.own[n++]=v}}
function serWar(w){var k=key(w.a,w.b),p=[];members(byId(w.a)).concat(members(byId(w.b))).forEach(function(m){if(m.pz&&m.pz.k===k)p.push({i:m.id,s:encPz(m.pz,w)})});
  return{a:w.a,b:w.b,t:r2(w.t),nid:w.nid,land:w.land,sp:w.sp,d0:w.d0,lost:w.lost,n0:w.n0,oc:w.oc||{},ms:w.ms||{},U:w.U.map(serU),p:p}}
function netTick(t){if(!isHost||!peers.length)return;var iv=wars.length?125:1000;if(t-wT<iv)return;wT=t;
  var wp=[];objs.forEach(function(o){if(o.founded&&o.wipe&&!o.mine&&o.uid)wp.push({u:o.uid,p:Math.floor(o.pop)})});
  bc({t:"W",w:wars.map(serWar),r:objs.filter(function(o){return o.founded}).map(function(o){return[o.id,o.ruler||0]})});
  wp.forEach(function(x){bc({t:"wp",u:x.u,p:x.p})})}
function applyW(m){var seen={};
  m.w.forEach(function(sw){var A=byId(sw.a),B=byId(sw.b);if(!A||!B)return;var k=key(sw.a,sw.b);seen[k]=1;
    var w=null;wars.forEach(function(x){if(key(x.a,x.b)===k)w=x});
    if(!w){w={a:sw.a,b:sw.b,t:0,U:[],nid:0,land:sw.land};wars.push(w);if(!wlOpened){wlOpened=true;$("bgp").classList.remove("show");$("wlp").classList.add("show")}}
    ["t","nid","land","sp","d0","lost","n0","oc","ms"].forEach(function(f){if(sw[f]!==undefined)w[f]=sw[f]});
    var old={};w.U.forEach(function(u){old[u.id]=u});var nu=[],byid={};
    sw.U.forEach(function(s2){var u=old[s2.id],fresh=!u;if(!u)u={};Object.keys(s2).forEach(function(f){if(f==="e"||f==="g"||f==="x"||f==="y")return;u[f]=s2[f]});
      u.nx=s2.x;u.ny=s2.y;if(fresh||u.x==null){u.x=s2.x;u.y=s2.y}nu.push(u);byid[u.id]=u});
    sw.U.forEach(function(s2){var u=byid[s2.id];u.eng=s2.e!=null?(byid[s2.e]||null):null;u.tg=s2.g?{x:s2.g[0],y:s2.g[1]}:null});
    w.U=nu;
    (sw.p||[]).forEach(function(q){var o=byId(q.i);if(!o||!o.pts)return;var z=ensurePz(o,k);decPz(z,q.s,w)})});
  wars=wars.filter(function(w){var k=key(w.a,w.b);if(seen[k])return true;clearPaint(k);return false});
  (m.r||[]).forEach(function(e){var o=byId(e[0]);if(o&&o.founded)o.ruler=e[1]||null})}
function smoothW(dt){if(isHost||!peers.length)return;var f=Math.min(1,dt*10);wars.forEach(function(w){w.U.forEach(function(u){if(u.nx!=null&&!u.dead){u.x+=(u.nx-u.x)*f;u.y+=(u.ny-u.y)*f}})})}
function netUI(){var h='<h4>🌐 接続 <button id="nx">閉じる</button></h4><div class="lbl">つながっている人：'+peers.length+'人 ／ 1端末1国（端末IDで管理）</div>';
  if(ns.m==="home")h+='<div class="row"><button class="pri" data-n="h">招待コードを作る</button><button data-n="j">参加する</button></div>';
  else if(ns.m==="hw")h+='<div class="lbl">①このコードを友達に送る</div><textarea readonly id="nc">'+ns.code+'</textarea><button data-n="cp">コピー</button><div class="lbl">②友達から届いた返信コードを貼る</div><textarea id="na"></textarea><button class="pri" data-n="ha">接続</button><button data-n="b">戻る</button>';
  else if(ns.m==="jw")h+='<div class="lbl">ホストから届いたコードを貼る</div><textarea id="na"></textarea><button class="pri" data-n="ja">返信コードを作る</button><button data-n="b">戻る</button>';
  else if(ns.m==="jc")h+='<div class="lbl">この返信コードをホストに送る（ホストが貼ると接続）</div><textarea readonly id="nc">'+ns.code+'</textarea><button data-n="cp">コピー</button><button data-n="b">戻る</button>';
  else h+='<div class="lbl">'+ns.m+'</div>';
  NP.innerHTML=h}
function bindNet(){
  $("netb").onclick=function(){NP.classList.toggle("show");if(NP.classList.contains("show")){ns.m="home";netUI()}};
  NP.addEventListener("click",async function(e){var t=e.target;if(t.id==="nx"){NP.classList.remove("show");return}var n=t.getAttribute&&t.getAttribute("data-n");if(!n)return;
    try{
      if(n==="b"){ns.m="home";netUI()}
      else if(n==="h"){ns.m="コード作成中…（数秒）";netUI();isHost=true;var pc=hostPc=mkPc(),dc=pc.createDataChannel("g");wire(dc);await pc.setLocalDescription(await pc.createOffer());await gathered(pc);ns.code=enc(pc.localDescription);ns.m="hw";netUI()}
      else if(n==="ha"){var c=$("na").value;if(!c.trim()){say("返信コードを貼ってください");return}if(!hostPc||hostPc.signalingState!=="have-local-offer"){say("先に「招待コードを作る」からやり直してください");return}await hostPc.setRemoteDescription(dec(c));ns.m="接続中…";netUI()}
      else if(n==="j"){ns.m="jw";netUI()}
      else if(n==="ja"){var c2=$("na").value;if(!c2.trim())return;ns.m="返信コード作成中…（数秒）";netUI();isHost=false;var p2=mkPc();p2.ondatachannel=function(ev){wire(ev.channel)};await p2.setRemoteDescription(dec(c2));await p2.setLocalDescription(await p2.createAnswer());await gathered(p2);ns.code=enc(p2.localDescription);ns.m="jc";netUI()}
      else if(n==="cp"){var ta=$("nc");ta.select();try{await navigator.clipboard.writeText(ta.value)}catch(x){document.execCommand("copy")}say("コピーしました")}
    }catch(err){ns.m="home";netUI();say("接続エラー: "+(err&&err.message||err))}
  })}
bindNet();
})();
</script>
