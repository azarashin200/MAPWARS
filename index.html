<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MAPWARS</title>
<style>
:root{--bg:#e8ecf1;--panel:rgba(255,255,255,.95);--panel2:rgba(15,23,42,.05);--line:rgba(15,23,42,.14);--text:#0f172a;--sub:#5b6678;--accent:#2f5bea;--accent-t:#fff;--shadow:0 6px 24px rgba(15,23,42,.16);--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--panel:rgba(18,24,42,.95);--panel2:rgba(255,255,255,.06);--line:rgba(255,255,255,.15);--text:#e8edf8;--sub:#93a0ba;--accent:#6f8cff;--accent-t:#0b1020;--shadow:0 6px 24px rgba(0,0,0,.55);--field:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--panel:rgba(18,24,42,.95);--panel2:rgba(255,255,255,.06);--line:rgba(255,255,255,.15);--text:#e8edf8;--sub:#93a0ba;--accent:#6f8cff;--accent-t:#0b1020;--shadow:0 6px 24px rgba(0,0,0,.55);--field:rgba(255,255,255,.07);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--panel);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:0;border-width:0 0 1px;z-index:4}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:.22em;margin-right:auto}
.logo svg{width:22px;height:22px;color:var(--accent);flex:none}
button{font:inherit;color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}
button:hover{background:var(--line)}button:disabled{opacity:.38;pointer-events:none}
button.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}button.pri:hover{filter:brightness(1.08);background:var(--accent)}button.danger{color:#e5484d}
#top button{border-color:var(--line);padding:6px 10px;font-size:12px}
#top button.pri{border-color:var(--accent)}
#who{font-size:11.5px;color:var(--sub);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#dock{position:absolute;left:10px;right:10px;bottom:12px;padding:6px;display:flex;gap:4px;max-width:520px;margin:0 auto}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:11px;border-radius:8px}
.tool i{display:flex;font-style:normal}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--accent);color:var(--accent-t)}
.vr{width:1px;background:var(--line);margin:6px 3px}
#sheet{position:absolute;left:10px;right:10px;bottom:88px;max-width:560px;margin:0 auto;padding:14px;max-height:56%;overflow:auto;touch-action:pan-y;display:none;-webkit-user-select:text;user-select:text}
#sheet.show{display:block}
body.nd #dock{display:none}body.nd #sheet,body.nd #cmd{bottom:var(--mh,12px)}body.nd #sheet{max-height:calc(100% - var(--mh,12px) - 70px)}
#cmd{position:absolute;left:10px;right:10px;bottom:88px;max-width:560px;margin:0 auto;padding:12px;display:none;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#cmd.show{display:block}
#cmd .ups button.cur{box-shadow:inset 0 0 0 2px var(--accent-t)}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sh h3{flex:1;margin:0;font-size:16px;letter-spacing:.02em}
.sh button{border-color:var(--line);padding:5px 10px;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 8px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:var(--panel2);font-weight:700}
td.e{padding:0}
input,textarea{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box;width:100%;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
td.e input{border:0;border-radius:0;background:transparent;padding:7px 8px;font-size:13px}
textarea{height:90px;resize:none;margin:6px 0}
.row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;line-height:1.55;white-space:pre-wrap;margin:6px 0 2px}
.lbl{font-size:11px;color:var(--sub);margin:8px 0 3px;line-height:1.5}
.lbl b{color:var(--text)}
.sp{flex:1}
input[type=range]{padding:0;border:0;background:none;height:24px;margin:0;touch-action:none}
.rgb{display:grid;grid-template-columns:14px 1fr 30px;gap:0 8px;align-items:center;font-size:11px;color:var(--sub)}
.rgb b{text-align:right;color:var(--text)}
.sw{height:24px;border-radius:6px;border:1px solid var(--line);margin:2px 0 6px}
#bgp{position:absolute;top:54px;right:10px;width:230px;padding:12px;display:none;z-index:3}
#bgp.show{display:block}
#bgp h4{margin:0 0 6px;font-size:13px}
#log{position:absolute;top:54px;left:10px;display:flex;flex-direction:column;gap:6px;max-width:62%;pointer-events:none}
.toast{padding:8px 12px;font-size:12px;border-radius:8px;border-left:3px solid var(--accent)}
.frr{display:grid;grid-template-columns:1fr 90px 28px;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.frr i{height:5px;border-radius:3px;background:var(--line);display:block;overflow:hidden}
.frr u{display:block;height:100%;background:var(--accent)}
.frr b{text-align:right}
.gauge{position:relative;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:4px 0 8px}
.gauge u{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#f5a524,#ffcf5a);transition:width .5s linear}
.gauge span{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text);text-shadow:0 0 3px var(--panel)}
.ups{display:flex;gap:6px;margin-bottom:6px}
.grp{border:2px solid var(--sub);border-radius:10px;padding:5px;margin-bottom:6px}.grp .ups{margin-bottom:0}
.ups.rt{justify-content:flex-end}.ups.rt button{flex:0 1 calc(33.333% - 4px)}
.ups button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--panel2);border-color:var(--line);padding:8px 4px;border-radius:8px}
.ups button{min-width:0}.ups .n{font-size:12px}.ups .l{font-size:16px;font-weight:800}.ups .c{font-size:10px;color:var(--sub);white-space:normal;text-align:center;line-height:1.3}
.ups button:not(:disabled){background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.ups button:not(:disabled) .c{color:inherit;opacity:.85}
#wlp{position:absolute;top:54px;left:10px;width:min(310px,62%);padding:10px;display:none;z-index:3}
#wlp .wb{max-height:34vh}
body:has(#wlp.show) #log{top:calc(54px + 34vh + 70px)}
#wlp.show{display:block}
#wlp h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
#wlp h4 button{padding:3px 8px;font-size:11px;border-color:var(--line)}
.wb{max-height:42vh;overflow:auto;touch-action:pan-y;font-size:12px;line-height:1.45;-webkit-user-select:text;user-select:text}
.wr{padding:3px 0;border-bottom:1px solid var(--line)}.wr i{font-style:normal;color:var(--sub);margin-right:6px;font-size:10.5px}
.wr.sea{color:#3e7bfa}.wr.land{color:#e5484d}.wr.win{font-weight:800}
#net{position:absolute;top:54px;right:10px;width:min(340px,86%);padding:10px;display:none;z-index:3;touch-action:pan-y;-webkit-user-select:text;user-select:text;max-height:70vh;overflow:auto}#net.show{display:block}#net h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}#net textarea{height:72px;font-size:10px;word-break:break-all}#net button{margin:2px 2px 2px 0;border-color:var(--line)}
#mine{position:absolute;left:10px;right:10px;bottom:12px;padding:6px 8px;display:none;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;z-index:2;-webkit-user-select:none;user-select:none;scrollbar-width:none}
#mine::-webkit-scrollbar{display:none}
#mine.show{display:flex}
#mine>*{flex:none}
#mine .sh{margin:0;padding:0 2px;border:0;min-width:56px;max-width:110px}
#mine .sh h3{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mine .gauge{width:150px;height:26px;margin:0}
#mine .ups{display:contents}
#mine .grp{display:flex;gap:6px;margin:0;padding:4px;flex:none}
#mine .ups.rt button{flex:none}#mine .ups.rt button:first-child{margin-left:auto}
#mine .ups button{flex:none;width:92px;padding:5px 4px;gap:0}
#mine .ups .l{font-size:14px}
#mine .ups .c{font-size:9.5px;line-height:1.2;min-height:11px}
@media (max-width:520px){.logo span{display:none}#top{gap:3px;padding:6px}#top button{padding:6px 7px;font-size:11.5px}#who{display:none}}
#decl{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 45%,rgba(160,16,24,.94),rgba(60,4,8,.97));color:#fff;text-align:center;padding:28px;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
#decl.show{display:flex;animation:dclIn .4s ease-out}
#decl .ic svg{width:84px;height:84px;animation:dclPulse 1s ease-in-out infinite}
#decl .nm{font-size:clamp(24px,7vw,44px);font-weight:800;line-height:1.4;word-break:break-all;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#decl .nm b{color:#ffd54a;font-size:1.25em}
#decl .rs{max-width:min(560px,92%);font-size:clamp(15px,4vw,20px);line-height:1.6;padding:12px 16px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);word-break:break-all;white-space:pre-wrap;text-align:left}
#decl .rs i{display:block;font-style:normal;font-size:11px;opacity:.7;letter-spacing:.1em;margin-bottom:4px}
#res{position:fixed;inset:0;z-index:55;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:28px;box-sizing:border-box;-webkit-user-select:none;user-select:none}
#res.show{display:flex;animation:dclIn .5s ease-out}
#res.win{background:radial-gradient(circle at 50% 45%,rgba(214,160,20,.95),rgba(70,44,2,.97))}
#res.lose{background:radial-gradient(circle at 50% 45%,rgba(70,76,92,.96),rgba(10,12,20,.98))}
#res.betray{background:radial-gradient(circle at 50% 45%,rgba(120,30,150,.95),rgba(30,4,44,.97))}
#res .big{font-size:clamp(38px,12vw,84px);font-weight:900;letter-spacing:.08em;text-shadow:0 3px 18px rgba(0,0,0,.5)}
#res .sub{font-size:clamp(18px,5vw,30px);font-weight:700;line-height:1.5;word-break:break-all;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#res .sub b{color:#ffd54a;font-size:1.15em}
#res .tp{font-size:12px;opacity:.7;margin-top:18px;letter-spacing:.1em}
#trc{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:45;display:none;flex-direction:column;gap:6px;align-items:stretch;width:min(360px,92%);padding:10px;box-sizing:border-box;border-radius:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:13px}
#trc.show{display:flex}
#trc .row{display:flex;gap:8px}#trc .row button{flex:1}
#rsn{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px;box-sizing:border-box}
#rsn.show{display:flex}
#rsn .bx{width:min(420px,100%);background:var(--panel,#222);color:var(--text,#eee);border:1px solid rgba(128,128,128,.4);border-radius:12px;padding:16px;box-sizing:border-box}
#rsn h3{margin:0 0 4px;font-size:16px}
#rsn p{margin:0 0 8px;font-size:12px;opacity:.75}
#rsn textarea{width:100%;box-sizing:border-box;min-height:84px;resize:vertical;font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid rgba(128,128,128,.5);background:rgba(128,128,128,.12);color:inherit}
#rsn .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;align-items:center}
#rsn .cnt{margin-right:auto;font-size:11px;opacity:.7}
#decl .tp{font-size:12px;opacity:.7;margin-top:18px;letter-spacing:.1em}
#dvp{position:absolute;top:54px;right:10px;width:min(350px,92%);padding:10px;display:none;z-index:3;max-height:82vh;overflow:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
#dvp.show{display:block}
#dvp h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;justify-content:space-between}
#dvp h4 button{padding:3px 8px;font-size:11px;border-color:var(--line)}
#dvp .dvl{max-height:26vh}#dvp .dvl2{max-height:20vh}#dvp .dvr .row{flex:none;justify-content:flex-end}#dvp .dvmg+.dvwar{margin-top:10px;padding-top:6px;border-top:2px solid var(--line)}
.dvr{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.35;cursor:pointer;border-radius:6px}
.dvr.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.dvr .cb{width:14px;height:14px;border:1.5px solid var(--sub);border-radius:3px;flex:none;box-sizing:border-box}
.dvr.on .cb{background:var(--accent);border-color:var(--accent)}
.dvr .dvc{flex:1;min-width:0}
.dvr .dvm{font-size:10.5px;color:var(--sub)}
.dvr button{padding:4px 8px;font-size:12px;border-color:var(--line)}
#dvp .ups{flex-wrap:wrap;margin-top:4px}#dvp .ups button{flex:1 1 30%}
#cmd .ups{flex-wrap:wrap}#cmd .ups button{flex:1 1 28%}
@keyframes dclIn{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
@keyframes dclPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ===== スマホ専用UI（幅600px以下、または横向きスマホ）。PC・iPadには影響しません ===== */
@media (max-width:600px),(max-height:480px) and (pointer:coarse){
  html,body{height:100dvh}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  button{min-height:40px;padding:8px 12px;font-size:14px;touch-action:manipulation}
  input,textarea{font-size:16px;min-height:42px}
  textarea{min-height:90px}
  td.e input{min-height:38px;padding:8px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
  th,td{padding:6px 8px}

  /* 上部バー：1行で横スクロール、ロゴはアイコンのみ */
  #top{gap:6px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #top::-webkit-scrollbar{display:none}
  #top>*{flex:none}
  .logo{margin-right:4px}.logo span{display:none}
  #top button{min-height:38px;padding:7px 12px;font-size:13px}
  #who{display:none}

  /* 上から開くパネル：全幅、画面上部に固定 */
  #bgp,#wlp,#net,#dvp{top:56px;left:8px;right:8px;width:auto;max-width:none;max-height:46dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;z-index:6}
  #bgp,#wlp{touch-action:pan-y}
  #wlp .wb{max-height:30dvh}
  #dvp .dvl{max-height:20dvh}#dvp .dvl2{max-height:16dvh}
  #net{max-height:60dvh}
  #wlp h4 button,#dvp h4 button{min-height:34px;padding:6px 12px;font-size:13px}
  .dvr{padding:10px 6px;gap:10px;font-size:13px}
  .dvr .cb{width:20px;height:20px}
  .dvr button{min-height:36px;padding:6px 12px}
  .wb{font-size:13px}
  body:has(#wlp.show) #log{top:calc(56px + 30dvh + 80px)}

  /* 通知 */
  #log{top:60px;left:8px;max-width:calc(100% - 16px)}
  .toast{font-size:13px;padding:9px 12px}

  /* 下のツールバー：大きく押しやすく */
  #dock{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none;padding:5px;gap:3px}
  .tool{padding:8px 2px;font-size:11px;min-height:54px;justify-content:center}
  .tool svg{width:24px;height:24px}
  .vr{margin:8px 2px}

  /* 下から開くシート：全幅・大きめ */
  #sheet,#cmd{left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:none;margin:0;border-radius:16px 16px 0 0;border-bottom-width:0;padding:12px 14px 14px;box-sizing:border-box}
  #sheet{max-height:52dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #sheet::before,#cmd::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
  body.nd #sheet,body.nd #cmd{bottom:var(--mh,12px)}
  body.nd #sheet{max-height:calc(100dvh - var(--mh,12px) - 70px)}
  .sh{gap:6px}
  .sh h3{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh button{min-height:38px;padding:6px 12px;font-size:13px}
  .row{gap:6px}
  .row button{min-height:42px}
  .lbl{font-size:12px}
  .note{font-size:14px}
  input[type=range]{height:34px}
  .rgb{grid-template-columns:16px 1fr 34px;gap:2px 10px;font-size:12px}
  .sw{height:28px}

  /* 強化ボタン（国・師団） */
  .ups{gap:6px}
  .ups button{padding:10px 4px;min-height:56px}
  .ups .n{font-size:13px}.ups .c{font-size:11px}
  #cmd .ups button{flex:1 1 30%}
  #dvp .ups button{flex:1 1 30%}

  /* 自国バー（下部横スクロール） */
  #mine{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:6px 8px;gap:8px}
  #mine .gauge{width:140px;height:30px}
  #mine .ups button{width:100px;min-height:48px;padding:6px 4px}
  #mine .ups .l{font-size:15px}
  #mine .ups .c{font-size:10px}
  body.nd #mine{bottom:calc(8px + env(safe-area-inset-bottom,0px))}

  /* 宣戦布告画面 */
  #decl{padding:20px}
}

/* ===== スマホUI v2：メニューをまとめる／パネルは下から開く ===== */
#moreb,#scrim{display:none}
#more{display:contents}
#top .logo{order:-2}#who{order:-1}
#netb{order:1}#dvb{order:2}#wlb{order:3}#spd{order:4}#bgb{order:5}#sndb{order:6}#bgmb{order:6}#home{order:7}
@media (max-width:600px),(max-height:480px) and (pointer:coarse){
  /* 上部バー：よく使うものだけ。残りは「⋯」にまとめる */
  #top{overflow:visible;touch-action:manipulation;gap:6px;padding:6px 10px;box-sizing:border-box;z-index:9}
  #top .logo{order:-2;margin-right:auto}
  #top>button{order:0;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:12px;font-size:14px}
  #top>#spd{order:1;min-width:76px;font-variant-numeric:tabular-nums}
  #top>#dvb{order:2}#top>#wlb{order:3}
  #top>#moreb{order:4;display:inline-flex;align-items:center;justify-content:center;width:44px;padding:0}
  #top>#moreb.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
  #more{display:none;position:absolute;top:calc(100% + 8px);left:8px;right:8px;padding:10px;grid-template-columns:repeat(4,1fr);gap:8px;z-index:10;border-radius:16px}
  #more.open{display:grid}

(function(){

/* 海：ドット絵風の小さな波が、ゆらゆらまたたく */

function resize(){var r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;cw=r.width;chh=r.height;cv.width=Math.round(cw*dpr);cv.height=Math.round(chh*dpr);render()}

var hmv=false;/* 構造物の移動モード */

var mm=$("mm"),mc=$("mmc"),mx=mc.getContext("2d"),mmT=0,mmF=null,mmDrag=false;

  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

    if(tool==="select"&&lastTap&&Date.now()-lastTap.t<400&&Math.hypot(p.x-lastTap.x,p.y-lastTap.y)<24){var ho=hitAt(s2w(p));if(ho&&ho===lastTap.o&&(!online||ho.mine)){mode="move";mvo=ho;mvl=s2w(p);lastTap=null;sel=ho;render()}}}
});

    var k=Object.keys(ptr),a=ptr[k[0]],b=ptr[k[1]],d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

  else if(mode==="draw"&&Math.hypot(p.x-lastS.x,p.y-lastS.y)>12){

function up(e){

/* ===== 戦争の同期：ホストだけが戦争を計算し、結果を全員に配る ===== */
var wT=0;
function r2(x){return Math.round(x*100)/100}
function serU(u){var o={};Object.keys(u).forEach(function(k){if(k==="tg"||k==="eng"||k==="last"||k==="fxN"||k==="wkN"||k==="dsN"||k==="bdN")return;var v=u[k];if(typeof v==="number")o[k]=r2(v);else if(v===null||typeof v==="string"||typeof v==="boolean")o[k]=v;else if(k==="ord")o.ord=v?{k:v.k,c:v.c,id:v.id}:null});
  o.e=u.eng?u.eng.id:null;o.g=u.tg?[r2(u.tg.x),r2(u.tg.y)]:null;return o}
function encPz(z,w){var out="",run=0,prev=null,i,c;for(i=0;i<z.own.length;i++){var v=z.own[i];c=v===0?".":v===w.a?"a":v===w.b?"b":"x";if(c===prev)run++;else{if(prev!==null)out+=run+prev;prev=c;run=1}}if(prev!==null)out+=run+prev;return out}
function decPz(z,str,w){var re=/(\d+)(.)/g,mm,n=0;while((mm=re.exec(str))){var c=mm[2],v=c==="a"?w.a:c==="b"?w.b:0,len=+mm[1];for(var j=0;j<len&&n<z.own.length;j++)z.own[n++]=v}}
function serWar(w){var k=key(w.a,w.b),p=[];members(byId(w.a)).concat(members(byId(w.b))).forEach(function(m){if(m.pz&&m.pz.k===k)p.push({i:m.id,s:encPz(m.pz,w)})});
  return{a:w.a,b:w.b,t:r2(w.t),nid:w.nid,land:w.land,sp:w.sp,d0:w.d0,lost:w.lost,n0:w.n0,oc:w.oc||{},ms:w.ms||{},U:w.U.map(serU),p:p}}
function netTick(t){if(!isHost||!peers.length)return;var iv=wars.length?125:1000;if(t-wT<iv)return;wT=t;
  var wp=[];objs.forEach(function(o){if(o.founded&&o.wipe&&!o.mine&&o.uid)wp.push({u:o.uid,p:Math.floor(o.pop)})});
  bc({t:"W",w:wars.map(serWar),r:objs.filter(function(o){return o.founded}).map(function(o){return[o.id,o.ruler||0]})});
  wp.forEach(function(x){bc({t:"wp",u:x.u,p:x.p})})}
function applyW(m){var seen={};
  m.w.forEach(function(sw){var A=byId(sw.a),B=byId(sw.b);if(!A||!B)return;var k=key(sw.a,sw.b);seen[k]=1;
    var w=null;wars.forEach(function(x){if(key(x.a,x.b)===k)w=x});
    if(!w){w={a:sw.a,b:sw.b,t:0,U:[],nid:0,land:sw.land};wars.push(w);if(!wlOpened){wlOpened=true;$("bgp").classList.remove("show");$("wlp").classList.add("show")}
      if(myObj&&myObj.founded){var mr2=root(myObj);if(mr2&&!myObj.ruler&&(mr2.id===w.a||mr2.id===w.b))openDv()}}
    ["t","nid","land","sp","d0","lost","n0","oc","ms"].forEach(function(f){if(sw[f]!==undefined)w[f]=sw[f]});
    var old={};w.U.forEach(function(u){old[u.id]=u});var nu=[],byid={};
    sw.U.forEach(function(s2){var u=old[s2.id],fresh=!u;if(!u)u={};var wasDead=!!u.dead;Object.keys(s2).forEach(function(f){if(f==="e"||f==="g"||f==="x"||f==="y"||f==="fxN"||f==="wkN"||f==="dsN"||f==="bdN")return;u[f]=s2[f]});if(!fresh&&!wasDead&&u.dead&&u.x!=null)fxBoom(u);
      u.nx=s2.x;u.ny=s2.y;if(fresh||u.x==null){u.x=s2.x;u.y=s2.y}nu.push(u);byid[u.id]=u});
    sw.U.forEach(function(s2){var u=byid[s2.id];u.eng=s2.e!=null?(byid[s2.e]||null):null;u.tg=s2.g?{x:s2.g[0],y:s2.g[1]}:null});
    w.U=nu;
    (sw.p||[]).forEach(function(q){var o=byId(q.i);if(!o||!o.pts)return;var z=ensurePz(o,k);decPz(z,q.s,w)})});
  wars=wars.filter(function(w){var k=key(w.a,w.b);if(seen[k])return true;clearPaint(k);return false});
  (m.r||[]).forEach(function(e){var o=byId(e[0]);if(o&&o.founded)o.ruler=e[1]||null})}
/* 参加側の端末は戦争を計算しないので、同期された状態から攻撃・移動エフェクトをここで出す */
function guestFx(){if(isHost||!peers.length)return;wars.forEach(function(w){w.U.forEach(function(u){if(u.dead||u.x==null)return;if(u.eng&&!u.eng.dead)fxFire(u,u.eng);if(u.m==="sea")fxWake(u);else if(u.m==="build")fxBuild(u);else if((u.gk|0)>=2&&u.nx!=null&&Math.hypot(u.nx-u.x,u.ny-u.y)>1.5)fxDust(u)})})}
function smoothW(dt){if(isHost||!peers.length)return;var f=Math.min(1,dt*10);wars.forEach(function(w){w.U.forEach(function(u){if(u.nx!=null&&!u.dead){u.x+=(u.nx-u.x)*f;u.y+=(u.ny-u.y)*f}})})}
function netUI(){var h='<h4>接続 <button id="nx">閉じる</button></h4><div class="lbl">つながっている人：'+peers.length+'人 ／ 1端末1国（端末IDで管理）</div>';
  if(ns.m==="home")h+='<div class="row"><button class="pri" data-n="h">招待コードを作る</button><button data-n="j">参加する</button></div>';
  else if(ns.m==="hw")h+='<div class="lbl">1. このコードを友達に送る</div><textarea readonly id="nc">'+ns.code+'</textarea><button data-n="cp">コピー</button><div class="lbl">2. 友達から届いた返信コードを貼る</div><textarea id="na"></textarea><button class="pri" data-n="ha">接続</button><button data-n="b">戻る</button>';
  else if(ns.m==="jw")h+='<div class="lbl">ホストから届いたコードを貼る</div><textarea id="na"></textarea><button class="pri" data-n="ja">返信コードを作る</button><button data-n="b">戻る</button>';
  else if(ns.m==="jc")h+='<div class="lbl">この返信コードをホストに送る（ホストが貼ると接続）</div><textarea readonly id="nc">'+ns.code+'</textarea><button data-n="cp">コピー</button><button data-n="b">戻る</button>';
  else h+='<div class="lbl">'+ns.m+'</div>';
  NP.innerHTML=h}
function bindNet(){
  $("netb").onclick=function(){NP.classList.toggle("show");if(NP.classList.contains("show")){ns.m="home";netUI()}};
  NP.addEventListener("click",async function(e){var t=e.target;if(t.id==="nx"){NP.classList.remove("show");return}var n=t.getAttribute&&t.getAttribute("data-n");if(!n)return;
    try{
      if(n==="b"){ns.m="home";netUI()}
      else if(n==="h"){ns.m="コード作成中…（数秒）";netUI();isHost=true;var pc=hostPc=mkPc(),dc=pc.createDataChannel("g");wire(dc);await pc.setLocalDescription(await pc.createOffer());await gathered(pc);ns.code=enc(pc.localDescription);ns.m="hw";netUI()}
      else if(n==="ha"){var c=$("na").value;if(!c.trim()){say("返信コードを貼ってください");return}if(!hostPc||hostPc.signalingState!=="have-local-offer"){say("先に「招待コードを作る」からやり直してください");return}await hostPc.setRemoteDescription(dec(c));ns.m="接続中…";netUI()}
      else if(n==="j"){ns.m="jw";netUI()}
      else if(n==="ja"){var c2=$("na").value;if(!c2.trim())return;ns.m="返信コード作成中…（数秒）";netUI();isHost=false;botClear();var p2=mkPc();p2.ondatachannel=function(ev){wire(ev.channel)};await p2.setRemoteDescription(dec(c2));await p2.setLocalDescription(await p2.createAnswer());await gathered(p2);ns.code=enc(p2.localDescription);ns.m="jc";netUI()}
      else if(n==="cp"){var ta=$("nc");ta.select();try{await navigator.clipboard.writeText(ta.value)}catch(x){document.execCommand("copy")}say("コピーしました")}
    }catch(err){ns.m="home";netUI();say("接続エラー: "+(err&&err.message||err))}
  })}
bindNet();
})();

/* ===== スマホUI v2 ===== */
(function(){
  var $=function(i){return document.getElementById(i)};
  var mq=window.matchMedia("(max-width:600px),(max-height:480px) and (pointer:coarse)");
  var P=["bgp","wlp","net","dvp"].map(function(i){return $(i)}),more=$("more"),mb=$("moreb"),sc=$("scrim");
  function anyOpen(){return P.some(function(p){return p.classList.contains("show")})}
  function sync(){var m=more.classList.contains("open");sc.classList.toggle("show",mq.matches&&(m||anyOpen()));mb.classList.toggle("on",m)}
  function closeMenu(){more.classList.remove("open");sync()}
  mb.addEventListener("click",function(){more.classList.toggle("open");if(more.classList.contains("open"))P.forEach(function(p){p.classList.remove("show")});sync()});
  more.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button");if(b&&b.id!=="sndb")setTimeout(closeMenu,0)});
  sc.addEventListener("click",function(){P.forEach(function(p){p.classList.remove("show")});closeMenu()});
  var mo=new MutationObserver(function(ms){
    if(mq.matches){ms.forEach(function(m){var p=m.target;if(p.classList.contains("show")){P.forEach(function(q){if(q!==p)q.classList.remove("show")});more.classList.remove("open")}})}
    sync()});
  P.forEach(function(p){mo.observe(p,{attributes:true,attributeFilter:["class"]})});
  window.addEventListener("resize",sync);
  sync();
})();
</script>
